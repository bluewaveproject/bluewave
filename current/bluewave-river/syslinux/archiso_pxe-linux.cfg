LABEL arch64_nbd
TEXT HELP
Boot the Blue Wave River install medium using NBD.
It allows you to install Blue Wave River or perform system maintenance.
ENDTEXT
MENU LABEL Blue Wave River install medium (NBD)
LINUX ::/%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD ::/%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y
SYSAPPEND 3

LABEL arch64_nfs
TEXT HELP
Boot the Blue Wave River live medium using NFS.
It allows you to install Blue Wave River or perform system maintenance.
ENDTEXT
MENU LABEL Blue Wave River install medium (NFS)
LINUX ::/%INSTALL_DIR%/boot/x86_64/vmlinuz-linux-lts
INITRD ::/%INSTALL_DIR%/boot/x86_64/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archiso_nfs_srv=${pxeserver}:/run/archiso/bootmnt cms_verify=y
SYSAPPEND 3

